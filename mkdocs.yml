# Docs site for panio. Build/preview locally with:
#   uvx --with mkdocs-material mkdocs serve
# Deployed to GitHub Pages by .github/workflows/docs.yml.
#
# Design records and bring-up notes (point-in-time, not documentation of the
# verified current state) live in the top-level notes/ directory, outside this
# docs tree — they are readable in the repo but never published.

site_name: panio
site_description: >-
  Agent-controlled target machine wrangler for low-level software
  development — netboot, serial, video+OCR, power, and HID control of a
  target board.
site_url: https://panio.dev/
repo_url: https://github.com/curtisgalloway/panio
repo_name: curtisgalloway/panio
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: README.md
  - Demos: demos.md
  - Tested hardware: hardware.md
  - Subsystem guides:
      - Netboot: netboot.md
      - Link mode (netif): netif.md
      - Serial console: serial.md
      - Power control: power.md
      - Named actions: actions.md
      - Video + OCR: video.md
      - Dashboard: dashboard.md
      - HID injection: hid.md
      - Switchable USB media: usb.md
      - RAM-only USB fastboot staging: fastboot.md
      - adb (Android targets): adb.md
  - Distributed control: distributed-control.md
  - Target leases: leases.md
  - MCP server (experimental): mcp.md
  - Standing up a control host: control-host.md
  - Exit status and errors: errors.md
  - Glossary: glossary.md
  - Developer docs:
      - Architecture: dev/architecture.md
      - Platform support: dev/platform-support.md
      - Requirements & progress: dev/requirements.md
      - Interfaces:
          - HID serial protocol: dev/hid-serial-protocol.md
          - OCR helper protocol: dev/ocr.md
          - HID dual-board design: dev/hid-dual-board-design.md
          - CLI error contract: dev/error-contract/design.md
      - Extending panio:
          - Adding power helpers: dev/adding-power-helpers.md
          - Agent evals: dev/agent-evals.md
          - Serial agent benchmark: dev/serial-agent-benchmark.md
      - Hardware-CI integration:
          - Gap analysis: dev/ci-integration/gap-analysis.md
          - Integration design: dev/ci-integration/design.md
          - Related work: dev/ci-integration/related-work.md
          - Redfish provider: dev/ci-integration/redfish-provider.md
