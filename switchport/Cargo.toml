[package]
name = "switchport"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Managed-switch port link and PoE control (TP-Link Easy Smart HTTP, SNMP) for panio"
repository = "https://github.com/curtisgalloway/panio"
readme = "README.md"
keywords = ["switch", "snmp", "poe", "link", "tp-link"]
categories = ["command-line-utilities", "hardware-support"]

[[bin]]
name = "switchport"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ureq = "2"
# Credentials from the environment, a file, or a command (never a flag value).
secret = { path = "../secret" }
# SNMP v2c sync client. default-features = false drops tokio and the v3
# crypto stack; what remains is asn1-rs.
snmp2 = { version = "0.5", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
