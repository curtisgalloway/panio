[package]
name = "panio"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Agent-controlled target machine wrangler — distributed bring-up control over SSH"

[[bin]]
name = "panio"
path = "src/main.rs"

[dependencies]
# --- CLI -----------------------------------------------------------------
clap = { version = "4", features = ["derive"] }

# --- Config: typed read model (serde/toml) + comment-preserving edits ----
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"

# --- Errors --------------------------------------------------------------
anyhow = "1"
thiserror = "2"

# --- Paths ---------------------------------------------------------------
dirs = "5"


# --- talking to the serialcap/hdmicap daemons (localhost HTTP) -----------
ureq = { version = "2", features = ["json"] }
serde_json = "1"

# --- direct DTR control fallback when serialcap isn't running ------------
serialport = "4"

# --- atomic file writes (lab file, state, shipped slices, capture output) -
tempfile = "3"

# --- process/identity primitives behind cli/src/platform.rs --------------
# uid for the per-user runtime + ControlMaster dirs, and the daemon pid
# probes. Each platform gets only what it can use: libc on Unix, the Win32
# process APIs on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
