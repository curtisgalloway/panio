# Keep the commit-SHA pins in .github/workflows current. Every `uses:` there
# is pinned to a full commit rather than a movable tag (Review M7;
# scripts/ci-actions-pinned.sh enforces it). Dependabot bumps the SHA and the
# trailing `# vX.Y.Z` comment together, in one grouped PR a week, so pinning
# does not mean freezing. Only GitHub Actions is covered here: Cargo
# dependency bumps are reviewed by hand.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
