name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Documentation-only pull requests skip the build and test jobs. This job
    # decides (scripts/ci-doc-only.sh classify is the one definition of
    # "doc-only"); the other jobs read its `code` output.
    #
    # Why job-level `if:` and not workflow-level `paths-ignore`: a workflow
    # skipped by paths-ignore reports nothing, so branch protection waits
    # forever on its required checks. A job skipped by `if:` reports success.
    #
    # The gate fails open. A skipped job also counts as passing, so a broken
    # classifier must never skip anything: `code` is only ever the string
    # 'false' for a pull request whose whole diff is documentation, and every
    # other outcome (push, git error, failed `changes` job leaving the output
    # empty) runs the full set.
    #
    # ALWAYS-RUN jobs, which never skip and never strip: coverage,
    # actions-pinned, release-guards, profile-pins (RELEASE-TRAIN.md pins hash
    # AGENTS.md and other docs), shellcheck, evals-check. Every other job is
    # skippable and, as its first step after checkout, deletes every doc-only
    # file from its checkout on every run. A build that comes to depend on a
    # doc file therefore fails on the PR that adds the dependency.
    # scripts/tests/test_ci_doc_only.py enforces this shape for new jobs.
    name: changes (doc-only PR detection)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify the change set
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-doc-only.sh classify

  coverage:
    # Project rule: every crate in the repo has a CI job, and
    # scripts/ci-local.sh mirrors the Linux ones. This job fails the build
    # when a new crate lands without either, so coverage gaps surface at the
    # PR that creates them instead of months later.
    name: ci coverage (every crate has a job)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every crate has a CI job
        run: bash scripts/ci-coverage-check.sh

  actions-pinned:
    # Supply-chain rule: every third-party action is pinned to a full commit
    # SHA, never a movable tag (Review M7). .github/dependabot.yml keeps the
    # pins current; this job fails the build if a `uses:` lands unpinned.
    name: actions pinned (every uses is a commit SHA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every action reference is a commit SHA
        run: bash scripts/ci-actions-pinned.sh

  release-guards:
    # release.yml's workflow_dispatch is artifacts-only, but a dispatch against
    # a tag also has ref_type == 'tag'. This evaluates every release job's
    # `if:` against branch/tag dispatches and stable/prerelease tag pushes and
    # fails if anything but a pushed v* tag would publish (#338).
    name: release guards (only a pushed v* tag publishes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Evaluate release.yml publishing guards
        run: python3 scripts/ci-release-guards.py

  profile-pins:
    # The release-train profile states facts derived from other files; its
    # `## Sources` table pins each one's blob id so a release knows which prose
    # to re-read. Nothing enforced that, and it drifted twice through green CI
    # (#219). Deliberately a repo-local check, not the skill's profile_check.py:
    # that lives in another repository and answers the broader "is this profile
    # executable" question at release time, and CI must not depend on a
    # personal skills repo.
    #
    # Stale pins only warn here; release.yml's `profile-pins` job is the one
    # that blocks. Failing every PR made most of them carry a re-pin of a
    # profile only a release reads (25 of 40 commits on main touched it), and
    # the release gate still catches drift before anything is built. A
    # malformed table (exit 2) still fails: that is a broken checker input,
    # not drift.
    name: profile pins (RELEASE-TRAIN.md sources are current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every pinned source still matches its blob id (warn only)
        run: |
          set +e
          bash scripts/ci-profile-pins.sh
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::warning title=Release-train profile pins are stale::A source pinned in RELEASE-TRAIN.md changed. The release workflow will refuse to build until the sections it feeds are re-read and re-pinned; see the log above for which rows." ;;
            *) exit "$rc" ;;
          esac
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Test the checker itself, and the other script guards
        # The step above only reports whether this tree's pins are current; it passes
        # just as well against a checker that has stopped checking. These run
        # the script as a subprocess against synthetic profiles, so each of
        # its three verdicts -- current, stale, unreadable table -- has a test
        # that fails when it is reverted.
        #
        # pyyaml is for test_workflow_container_shell.py, which parses the
        # workflows themselves to keep bash-only syntax out of the container
        # jobs whose steps run under dash. That guard exists because
        # release.yml runs only on a tag push, so nothing else in CI executes
        # its steps before a tag is already public.
        # pyusb matches the standalone Openterface diagnostic's dependency.
        run: uv run --with pytest --with pyyaml --with pyusb==1.3.1 pytest -q scripts/tests

  shellcheck:
    # Every tracked shell script, at shellcheck's default (info) severity. A
    # finding that is intended carries a `# shellcheck disable=` directive
    # with its reason on the comment line above.
    name: shellcheck (every tracked *.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck

  zigplug:
    # The Python power helper: a locked install, Google-style formatting at
    # 88 columns (pyink, configured in pyproject.toml), a byte-compile of the
    # package, and pytest once zigplug/tests exists.
    name: zigplug (pyink, compileall, pytest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zigplug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Strip doc-only files (enforces the doc-only skip invariant)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-doc-only.sh strip
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Sync from the lockfile
        run: uv sync --frozen
      - name: Format check
        run: uv run pyink --check --diff .
      - name: Byte-compile
        run: uv run python -m compileall -q src
      - name: Test
        run: |
          if [ -d tests ]; then
            uv run pytest -q tests
          else
            echo "zigplug/tests does not exist yet; nothing to run."
          fi

  ocr-helpers:
    # The Python OCR helper (ocr/linuxocr) and its bbox-mapping tests in
    # ocr/tests. Not a Cargo crate, so ci-coverage-check.sh doesn't see it --
    # see the macos job's visionocr self-test step and the windows job's
    # winocr comment for this helper directory's other explicit coverage.
    # No lockfile here (unlike zigplug): the helper has no third-party
    # runtime dependencies of its own, so the test deps are supplied inline.
    name: ocr helpers (pytest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Strip doc-only files (enforces the doc-only skip invariant)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-doc-only.sh strip
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Test
        run: uv run --with pytest --with pillow pytest -q ocr/tests

  evals-check:
    # evals/scenarios/*.toml assert the CLI surface; run.py --check re-walks
    # the live `panio --help` tree and fails when a scenario references a
    # command or flag that no longer exists. It needs a real binary, so this
    # job builds cli (debug, cached) rather than trusting a stale dump.
    name: evals check (scenario references vs live CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build panio
        run: cargo build --manifest-path cli/Cargo.toml
      - name: Drift check
        run: PATH="$PWD/cli/target/debug:$PATH" python3 evals/run.py --check

  serialcap:
    name: serialcap (fmt, clippy, test)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
