  windows:
    # The Windows port. Every crate is built here, because the whole point of
    # the port is that the `#[cfg]` branches in cli/src/platform.rs and its
    # copies only ever compile on the platform they are written for — a Unix-only
    # CI cannot tell you that the Windows arm still builds.
    #
    # This runs the same fmt/clippy/test triple as the Linux jobs, in one job
    # rather than ten, because the crates are small and a Windows runner minute
    # costs twice a Linux one. A per-crate failure still names the crate.
    #
    # What CI cannot cover: anything needing the bench hardware. hdmicap's
    # Media Foundation backend and the ch9329 HID path are verified by hand on
    # the Windows bench host, not here. See AGENTS.md under **Platform support** for what is
    # and is not verified.
    name: windows (all crates, fmt, clippy, test)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Strip doc-only files (enforces the doc-only skip invariant)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-doc-only.sh strip
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            cli
            hdmicap
            serialcap
            netbootd
            cambrionix
            dsdrelay
            dsdble
            phidget
            hidrig
            ch9329
            shellyplug
            switchport
            amt
            secret
      - name: Format, clippy and test every crate
        shell: pwsh
        run: |
          $crates = "cli","hdmicap","serialcap","netbootd","cambrionix","dsdrelay","dsdble","phidget","hidrig","ch9329","shellyplug","switchport","amt","secret"
          $failed = @()
          foreach ($c in $crates) {
            Write-Host "::group::$c"
            Push-Location $c
            cargo fmt --check;   if ($LASTEXITCODE -ne 0) { $failed += "$c (fmt)" }
            cargo clippy --all-targets -- -D warnings; if ($LASTEXITCODE -ne 0) { $failed += "$c (clippy)" }
            cargo test;          if ($LASTEXITCODE -ne 0) { $failed += "$c (test)" }
            Pop-Location
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::failed: $($failed -join ', ')"
            exit 1
          }

      # The OCR helper is not a workspace crate (it lives under ocr/ with its
      # Swift and Python siblings), so ci-coverage-check.sh does not see it and
      # it needs covering explicitly. Windows-only by nature.
      #
      # `cargo test` here is the only place check_dimensions/read_bounded
      # (issue #150's shared resource limits) get exercised as compiled code
      # with `mod win` (cfg(windows)) actually active -- see the "ocr helpers"
      # and "macos" jobs for the equivalent pytest/`--self-test` coverage of
      # linuxocr/rapidocr and visionocr.
      - name: winocr (fmt, clippy, build, test)
        shell: pwsh
        working-directory: ocr/winocr
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo test
          if ($LASTEXITCODE -ne 0) { exit 1 }

  macos:
    # Exercises the macOS-only stack the Linux jobs can't: hdmicap's AVFoundation
    # capture path and the Apple Vision OCR helper. fmt/clippy run on both Linux
    # (V4L2 path) and here (AVFoundation path) so each per-OS cfg branch is gated
    # on the platform that compiles it.
    name: macos (hdmicap, visionocr)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Strip doc-only files (enforces the doc-only skip invariant)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-doc-only.sh strip
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: hdmicap
      - name: Format
        working-directory: hdmicap
        run: cargo fmt --check
      - name: Clippy
        working-directory: hdmicap
        run: cargo clippy --all-targets -- -D warnings
      - name: Build + test hdmicap (AVFoundation capture path)
        working-directory: hdmicap
        run: cargo test
      - name: Compile visionocr (Apple Vision OCR helper)
        run: swiftc -O -o "$RUNNER_TEMP/visionocr" ocr/visionocr.swift
      - name: visionocr bbox self-test
        run: '"$RUNNER_TEMP/visionocr" --self-test'
      - name: visionocr help without image input
        run: |
          for flag in --help -h; do
            "$RUNNER_TEMP/visionocr" --json missing-image.png "$flag" > "$RUNNER_TEMP/visionocr-help.txt"
            grep -q 'Usage: visionocr' "$RUNNER_TEMP/visionocr-help.txt"
            grep -q -- '--accurate' "$RUNNER_TEMP/visionocr-help.txt"
            grep -q -- '--self-test' "$RUNNER_TEMP/visionocr-help.txt"
          done
