      - name: Test
        run: cargo test

  ch9329:
    name: ch9329 (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ch9329
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ch9329
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  jetkvm:
    # The Go hid helper for JetKVM network KVMs. Not a Cargo crate, so it gets
    # its own job: gofmt (fails on any unformatted file), vet, and the tests,
    # which include a fake JetKVM (login, signaling, WebRTC answerer) run
    # end to end under the race detector.
    name: jetkvm (gofmt, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetkvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: jetkvm/go.mod
          cache-dependency-path: jetkvm/go.sum
      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  hidrig:
    name: hidrig (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hidrig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
