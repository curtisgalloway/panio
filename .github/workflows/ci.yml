  netbootd:
    # Two jobs rather than a matrix: a matrix job skipped by `if:` (a doc-only
    # PR) reports its check under the unexpanded name `matrix.name`, so the
    # required "netbootd (fmt, clippy, test)" check would never report (#354).
    # scripts/tests/test_ci_doc_only.py forbids matrix/expression names on
    # skippable jobs.
    name: netbootd (fmt, clippy, test)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
