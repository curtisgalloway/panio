# Create and push an annotated v* release tag on main HEAD, for a releaser
# that can start a workflow but cannot push a tag itself (a cloud agent
# session: its git proxy rejects every push that is not a branch).
#
# This workflow only tags. Publishing stays where it was: the tag push
# triggers release.yml, whose publishing jobs still require a push event on a
# v* tag (#338). That is why the tag is pushed with a deploy key and not with
# the workflow's own GITHUB_TOKEN: a ref pushed with GITHUB_TOKEN starts no
# workflow, so release.yml would never run.
#
# Setup, once: a deploy key on this repository with write access, its private
# half stored as the secret RELEASE_TAG_DEPLOY_KEY of the `release-tag`
# environment, and that environment's deployment branches limited to `main`.
# The environment is the real gate on the key. Anyone who can push a branch
# can dispatch an edited copy of this file from it, and nothing written in
# the file can stop that; GitHub refuses to hand an environment's secrets to
# a run on a ref the environment does not allow. It must stay a secret of the
# environment, never of the repository. Without it the tag job fails before
# it tags anything.
#
# Two jobs, so the key is never in a process that runs repository scripts:
# `preflight` holds no secret and does every check; `tag` holds the key and
# runs only git.
#
# Every check AGENTS.md "Cutting a release" asks of a human releaser is
# repeated here, because the dispatcher's word is not evidence: the commit is
# main HEAD, CI is green on it, the profile pins are current, the tag is new
# and is the next version.

name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create, vX.Y.Z (no prerelease suffix)"
        required: true
        type: string
      sha:
        description: "Full 40-character commit id to tag; must be main HEAD"
        required: true
        type: string
      summary:
        description: "Headline for the tag subject, lowercase, one line (the part after 'vX.Y.Z: ')"
        required: true
        type: string
      body:
        description: "Optional body paragraph for the tag message"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# One release at a time, and never cancel one that has started tagging.
concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # Inputs reach the shell only through the environment, never by
    # interpolation into a script, so a crafted summary cannot inject commands.
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}
      SUMMARY: ${{ inputs.summary }}
    steps:
      - name: Refuse a dispatch that cannot work
        run: |
          set -euo pipefail
          # A fast, readable failure only. The `release-tag` environment's
          # branch policy is what actually keeps the key on main.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch this workflow from main, not $GITHUB_REF."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::version must look like v1.2.3."
            exit 1
          fi
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a full 40-character lowercase commit id."
            exit 1
          fi
          if [ -z "$SUMMARY" ] || [ "$(printf '%s' "$SUMMARY" | wc -l)" -ne 0 ] || [ "${#SUMMARY}" -gt 100 ]; then
            echo "::error::summary must be one non-empty line of at most 100 characters."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check the commit is main HEAD and the tag is the next version
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$SHA" ]; then
            echo "::error::main HEAD is $head, not the requested $SHA. main moved; re-check and dispatch again."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists."
            exit 1
          fi
          latest="$(git tag -l 'v*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)"
          newest="$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -1)"
          if [ -n "$latest" ] && { [ "$newest" != "$VERSION" ] || [ "$latest" = "$VERSION" ]; }; then
            echo "::error::$VERSION is not newer than the latest release tag $latest."
            exit 1
          fi
          echo "Will tag $SHA as $VERSION (previous release: ${latest:-none})."

      - name: Check every pinned source still matches its blob id
        run: bash scripts/ci-profile-pins.sh

      # The run-level conclusion alone is not enough: a run whose jobs were
      # skipped also concludes "success". Require the push-triggered ci.yml
      # run for this exact commit on this repository's main, and require
      # every one of its jobs to have succeeded.
      - name: Check CI is green on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push&per_page=1" \
            --jq '.workflow_runs[0] // {} | [(.id // 0), (.conclusion // "none"), (.head_branch // ""), (.head_sha // ""), (.head_repository.full_name // "")] | @tsv')"
          IFS="$(printf '\t')" read -r id conclusion branch sha repo <<EOF
          $run
          EOF
          if [ "$conclusion" != "success" ] || [ "$branch" != "main" ] || [ "$sha" != "$SHA" ] || [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::No successful push-triggered ci.yml run on main for $SHA (found run $id: conclusion '$conclusion', branch '$branch', repository '$repo')."
            exit 1
          fi
          jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '.jobs[] | [.conclusion // "none", .name] | @tsv')"
          total="$(printf '%s\n' "$jobs" | grep -c . || true)"
          bad="$(printf '%s\n' "$jobs" | grep -v "^success$(printf '\t')" | grep . || true)"
          if [ "$total" -eq 0 ] || [ -n "$bad" ]; then
            echo "::error::ci.yml run $id has $total jobs and these did not succeed:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "ci.yml run $id: all $total jobs succeeded."

  tag:
    name: tag ${{ inputs.version }}
    needs: preflight
    runs-on: ubuntu-latest
    # Holds the deploy key. Its branch policy (main only) is enforced by
    # GitHub, outside this file. Nothing below runs a script from the
    # repository: only git, against a commit id preflight already vetted.
    environment: release-tag
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}
      SUMMARY: ${{ inputs.summary }}
      BODY: ${{ inputs.body }}
    steps:
      - name: Refuse to run without the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_TAG_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Secret RELEASE_TAG_DEPLOY_KEY is not set on the release-tag environment; see the header of cut-release.yml."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          ssh-key: ${{ secrets.RELEASE_TAG_DEPLOY_KEY }}

      - name: Create and push the annotated tag
        run: |
          set -euo pipefail
          # main may have moved while preflight ran; tag only the vetted commit.
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$SHA" ]; then
            echo "::error::main HEAD is now $head, not the vetted $SHA. Dispatch again."
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
            echo "::error::Tag $VERSION already exists on origin."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$BODY" ]; then
            git tag -a "$VERSION" -m "$VERSION: $SUMMARY" -m "$BODY" "$SHA"
          else
            git tag -a "$VERSION" -m "$VERSION: $SUMMARY" "$SHA"
          fi
          git push origin "refs/tags/$VERSION"
          echo "Pushed $VERSION at $SHA; release.yml takes it from here." >> "$GITHUB_STEP_SUMMARY"
