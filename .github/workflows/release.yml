# Build packages for every platform — Linux (.deb + tarball, amd64 and
# arm64), Windows (portable zip), macOS (a single universal arm64+x86_64
# tarball) — and attach them all to a GitHub Release when a v* tag is pushed,
# then fire a repository_dispatch at the Homebrew tap so it re-pins its
# formula to the new tag, and re-run the docs workflow so the Pages apt
# repository picks up the new .debs. Every asset ships with a `.sha256`
# sidecar, so a consumer (the tap's formula, in particular) can verify or
# re-pin a download without fetching it first.
# workflow_dispatch builds the packages as artifacts only (no Release, no tap
# bump), for testing the pipeline.
#
# Linux builds run inside a debian:bookworm container so binaries link
# against glibc 2.36 — the packages then run on Debian 12+, 13, and current
# Raspberry Pi OS. Building bare on the ubuntu-24.04 runners (glibc 2.39)
# would silently exclude bookworm machines.

name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NFPM_VERSION: 2.46.3
  HELPERS: hdmicap serialcap netbootd cambrionix hidrig ch9329 shellyplug amt

jobs:
  package:
    name: package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          # bottle_tag is the Homebrew bottle tag this arch pours as; see
          # "Build Homebrew bottle" below.
          - arch: amd64
            runner: ubuntu-latest
            bottle_tag: x86_64_linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            bottle_tag: arm64_linux
    steps:
      # Same package list `make check-deps` enforces, plus the toolchain
      # bootstrap bits the container lacks. git must precede checkout so the
      # action does a real clone (the REST-download fallback has no .git).
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libudev-dev libclang-dev clang \
            cmake nasm curl ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same SHA-pinned toolchain action ci.yml uses, in place of an
      # ad-hoc `curl https://sh.rustup.rs | sh` here. The container has no
      # rustup, and the action bootstraps one itself (it needs the curl and
      # ca-certificates installed above); the download still happens, but
      # its flags and its source now live in a pinned, Dependabot-tracked
      # action that can be read at that commit, not in a pipe nobody diffs.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.arch }}
          workspaces: |
            cli
            hdmicap
            serialcap
            netbootd
            cambrionix
            hidrig
            ch9329
            shellyplug
            amt

      # GITHUB_SHA, not `git rev-parse`: the container's uid differs from the
      # workspace owner, so git refuses with "dubious ownership" (and the
      # failure hides inside the command substitution). printf is POSIX —
      # container steps run under sh, where ${VAR:0:7} would not parse.
      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0~dev.$(printf '%.7s' "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          fi

      # PANIOLO_VERSION is what `paniolo --version` prints (cli/src/main.rs);
      # it is the same string the package carries, so the two never disagree.
      - name: Build release binaries
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          PANIOLO_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for crate in cli $HELPERS; do
            echo "==> cargo build --release ($crate)"
            cargo build --release --manifest-path "$crate/Cargo.toml"
          done

      - name: Stage package tree
        run: |
          mkdir -p packaging/stage/bin packaging/stage/libexec
          install -m 0755 cli/target/release/paniolo packaging/stage/bin/
          for helper in $HELPERS; do
            install -m 0755 "$helper/target/release/$helper" packaging/stage/libexec/
          done
          install -m 0755 ocr/linuxocr packaging/stage/libexec/
          # The GUI-mode engine. The script ships; its ~317 MB venv does not —
          # `paniolo setup` builds that only when a lab file sets
          # `ocr_mode = "gui"`, so a .deb stays a .deb.
          install -m 0755 ocr/rapidocr packaging/stage/libexec/

      # The .deb is checked against the checksums.txt goreleaser publishes
      # alongside it before apt installs it as root — a swapped download would
      # otherwise run its maintainer scripts inside the build. --ignore-missing
      # skips the other assets the file lists; sha256sum still fails when
      # nothing it lists was found.
      - name: Install nfpm
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          mkdir -p /tmp/nfpm && cd /tmp/nfpm
          curl -fsSL -O "$base/nfpm_${NFPM_VERSION}_${ARCH}.deb"
          curl -fsSL -O "$base/checksums.txt"
          sha256sum -c --ignore-missing checksums.txt
          apt-get install -y "/tmp/nfpm/nfpm_${NFPM_VERSION}_${ARCH}.deb"

      - name: Build .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          nfpm package -f packaging/nfpm.yaml -p deb \
            -t "dist/paniolo_${VERSION}_${ARCH}.deb"

      - name: Build tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          tardir="paniolo-${VERSION}-linux-${ARCH}"
          mkdir -p "dist/$tardir"
          cp packaging/stage/bin/paniolo packaging/stage/libexec/* \
            LICENSE README.md "dist/$tardir/"
          cp -r skills "dist/$tardir/skills"
          tar -C dist -czf "dist/$tardir.tar.gz" "$tardir"
          rm -r "dist/$tardir"

      # The same binaries once more, as a Homebrew bottle: keg layout
      # (bin/, libexec/bin/, share/paniolo/skills/) under paniolo/<version>/,
      # named the way Homebrew fetches a bottle from a plain https root_url
      # (<name>-<version>.<tag>.bottle.tar.gz). The tap's formula pins this
      # arch's exact tag, so `brew install` on Linux pours it rather than
      # copying the flat tarball above. Bottles exist because a pour skips
      # Homebrew's build-from-source preflight, which refuses outright on a
      # macOS newer than its Xcode table (#225); Linux gets them too because
      # the macOS bottle is tagged `all`, and without exact Linux tags a
      # Linux `brew install` would pour the Mach-O one. Layout mirrors the
      # tap formula's install block for the flat tarball.
      - name: Build Homebrew bottle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BOTTLE_TAG: ${{ matrix.bottle_tag }}
        run: |
          # `set -eu`, not `set -euo pipefail`: this job runs inside the
          # debian:bookworm container, where the runner's default shell is
          # `sh -e {0}` and /bin/sh is dash, which has no `pipefail` and exits
          # 2 on `set -o pipefail` ("Illegal option"). That is what broke the
          # v0.4.0 tag build on both Linux arches. There is no pipeline in
          # this step, so -eu is equivalent here; a step that needs pipefail
          # must declare `shell: bash` too. The bash-only forms elsewhere in
          # this file are all in the macOS and Windows jobs, which already
          # run under bash. Enforced by
          # scripts/tests/test_workflow_container_shell.py.
          set -eu
          keg="$RUNNER_TEMP/bottle/paniolo/${VERSION}"
          mkdir -p "$keg/bin" "$keg/libexec/bin" "$keg/share/paniolo"
          cp packaging/stage/bin/paniolo "$keg/bin/"
          cp packaging/stage/libexec/* "$keg/libexec/bin/"
          cp -r skills "$keg/share/paniolo/skills"
          cp LICENSE "$keg/"
          tar -C "$RUNNER_TEMP/bottle" -czf "dist/paniolo-${VERSION}.${BOTTLE_TAG}.bottle.tar.gz" paniolo
          rm -r "$RUNNER_TEMP/bottle"
          # What a pour will put in the Cellar: the CLI and every helper
          # where the CLI's exe-relative lookup expects them.
          tar -tzf "dist/paniolo-${VERSION}.${BOTTLE_TAG}.bottle.tar.gz" > "$RUNNER_TEMP/bottle.list"
          grep -qx "paniolo/${VERSION}/bin/paniolo" "$RUNNER_TEMP/bottle.list"
          for helper in $HELPERS linuxocr rapidocr; do
            grep -qx "paniolo/${VERSION}/libexec/bin/$helper" "$RUNNER_TEMP/bottle.list"
          done
          grep -qx "paniolo/${VERSION}/share/paniolo/skills/paniolo/SKILL.md" "$RUNNER_TEMP/bottle.list"

      # A sidecar per asset (matching the Windows zip's own .sha256), so the
      # Homebrew tap's binary-only formula can verify and re-pin a download
      # without fetching it first. Run from dist/ so the recorded filename
      # has no directory prefix, matching the Windows sidecar's format.
      - name: Write checksum sidecars
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          BOTTLE_TAG: ${{ matrix.bottle_tag }}
        run: |
          cd dist
          sha256sum "paniolo_${VERSION}_${ARCH}.deb" > "paniolo_${VERSION}_${ARCH}.deb.sha256"
          sha256sum "paniolo-${VERSION}-linux-${ARCH}.tar.gz" > "paniolo-${VERSION}-linux-${ARCH}.tar.gz.sha256"
          sha256sum "paniolo-${VERSION}.${BOTTLE_TAG}.bottle.tar.gz" > "paniolo-${VERSION}.${BOTTLE_TAG}.bottle.tar.gz.sha256"

      # We're already root inside the bookworm container: install the deb for
      # real and check the layout + helper discovery end to end.
      - name: Smoke-test the .deb
        run: |
          # This container has never seen paniolo, so this is the fresh-install
          # path: dpkg runs postinst as `configure` with no old version, and
          # the package must not describe that as an upgrade (#228).
          apt-get install -y ./dist/paniolo_*.deb 2>&1 | tee "$RUNNER_TEMP/install.log"
          grep -q 'paniolo: installed' "$RUNNER_TEMP/install.log"
          if grep -q 'paniolo: upgrade' "$RUNNER_TEMP/install.log"; then
            echo "::error::postinst called a fresh install an upgrade"
            exit 1
          fi
          test -x /usr/bin/paniolo
          # Run each helper, not just stat it: --help returns 0 only once the
          # binary has loaded, so a missing shared library (libudev, a
          # turbojpeg .so) fails the release here rather than on a user's box.
          # linuxocr and rapidocr are Python; their argparse --help exercises
          # the python3 dependency the .deb declares.
          for helper in $HELPERS; do
            test -x "/usr/libexec/paniolo/bin/$helper"
            "/usr/libexec/paniolo/bin/$helper" --help >/dev/null
          done
          test -x /usr/libexec/paniolo/bin/linuxocr
          /usr/libexec/paniolo/bin/linuxocr --help >/dev/null
          test -x /usr/libexec/paniolo/bin/rapidocr
          /usr/libexec/paniolo/bin/rapidocr --help >/dev/null
          test -f /usr/share/paniolo/skills/paniolo/SKILL.md
          /usr/bin/paniolo --help
          # The binary reports the version the package carries.
          test "$(/usr/bin/paniolo --version)" = "paniolo $(dpkg-query -W -f='${Version}' paniolo)"
          # Run outside the checkout so `skill` resolves the packaged copy
          # under /usr/share rather than the repo's skills/ dir.
          ( cd /tmp && /usr/bin/paniolo skill )
          # Installing over an installed paniolo is the upgrade path: dpkg
          # runs postinst as `configure <old version>`, and the message must
          # say so, naming the version it replaced (#228). A reinstall of the
          # same version takes exactly that path.
          apt-get install -y --reinstall ./dist/paniolo_*.deb 2>&1 | tee "$RUNNER_TEMP/reinstall.log"
          grep -q "paniolo: upgrade from $(dpkg-query -W -f='${Version}' paniolo) complete" "$RUNNER_TEMP/reinstall.log"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  package-windows:
    name: package (windows x86_64)
    runs-on: windows-latest
    # `environment: release` is what puts `:environment:` in the OIDC subject
    # the federated credential matches, exactly as in oh-brother. It also gates
    # the whole job behind the environment's reviewer approval.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-x86_64
          workspaces: |
            cli
            hdmicap
            serialcap
            netbootd
            cambrionix
            hidrig
            ch9329
            shellyplug
            amt

      # The portable layout the CLI's helper lookup expects on Windows:
      #   paniolo\paniolo.exe        <- the only thing that goes on PATH
      #   paniolo\libexec\*.exe     <- helpers, found relative to the exe
      # There is no bin/libexec split on Windows, so the exe's own directory is
      # the install prefix (see `exe_relative_dirs` in cli/src/daemons.rs).
      - name: Build every crate
        shell: pwsh
        run: |
          $stage = "dist/paniolo"
          New-Item -ItemType Directory -Force -Path "$stage/libexec" | Out-Null
          # What `paniolo --version` prints: the tag, or a dev stamp on a
          # non-tag run (the same shape the Linux job's version step uses).
          $env:PANIOLO_VERSION = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME -replace "^v", "" } else { "0.0.0-dev." + $env:GITHUB_SHA.Substring(0, 7) }
          cargo build --release --manifest-path cli/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item cli/target/release/paniolo.exe "$stage/paniolo.exe"
          foreach ($h in "$env:HELPERS".Split(" ")) {
            cargo build --release --manifest-path "$h/Cargo.toml"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Copy-Item "$h/target/release/$h.exe" "$stage/libexec/$h.exe"
          }
          # The OCR helper is per-platform and not a workspace crate, so it is
          # built explicitly rather than coming from $env:HELPERS. Without it a
          # Windows install has no OCR at all — `paniolo video read` would have
          # nothing to call. See docs/dev/ocr.md.
          cargo build --release --manifest-path ocr/winocr/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item ocr/winocr/target/release/winocr.exe "$stage/libexec/winocr.exe"
          # netbootd's privileged BPF helper is a macOS-only setuid binary; it
          # builds to a stub off macOS and has no business in a Windows zip.
          Get-ChildItem "$stage/libexec" | Select-Object -ExpandProperty Name
          # The bundled agent skills, at the same share/paniolo/skills the
          # .deb, tarball and keg keep under their prefix; here the exe's own
          # directory is the prefix (skills_dirs_for_exe in cli/src/skills.rs).
          # Through v0.3.0 the zip had none, and `paniolo skill` on a Windows
          # install listed nothing.
          foreach ($manifest in Get-ChildItem skills/*/SKILL.md) {
            $name = $manifest.Directory.Name
            New-Item -ItemType Directory -Force -Path "$stage/share/paniolo/skills/$name" | Out-Null
            Copy-Item $manifest.FullName "$stage/share/paniolo/skills/$name/SKILL.md"
          }
          Get-ChildItem -Recurse "$stage/share" -Filter SKILL.md | Select-Object -ExpandProperty FullName

      # ---- Signing (skips entirely until the Azure vars are set) ----
      # Same Artifact Signing account and OIDC identity as oh-brother. No
      # subscription-id and allow-no-subscriptions on purpose: the signing
      # identity holds only the certificate-profile signer role, so an ordinary
      # login dies with "No subscriptions found".
      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Every exe is signed *before* zipping: a zip carries no Authenticode
      # signature, and SmartScreen judges the exe the user runs. That is ten
      # files rather than oh-brother's three, but one glob covers them, and
      # none of Burn's engine detach/reattach dance applies to a portable zip.
      #
      # timestamp-rfc3161 is set explicitly rather than left to the action's
      # default: Artifact Signing certificates live 72 hours, so an
      # untimestamped signature verifies on release day and dies three days
      # later, in the field, where nobody is watching.
      - name: Sign binaries
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\paniolo
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Confirm the signing landed rather than trusting that it did, and assert
      # the timestamp for the 72-hour reason above.
      - name: Verify signatures
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem dist/paniolo -Recurse -Filter *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::$($_.Name) is not validly signed ($($sig.Status))"
              $failed = $true
            }
            if (-not $sig.TimeStamperCertificate) {
              Write-Host "::error::$($_.Name) has no RFC3161 timestamp; its signature dies with the 72-hour certificate"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      # The ref reaches pwsh through env rather than a `${{ }}` spliced into
      # the script source, where a ref containing a quote would be code.
      # github.ref_name is never empty (the tag on a tag push, the branch on
      # workflow_dispatch), so the old `$ver = "dev"` fallback was unreachable.
      - name: Zip
        shell: pwsh
        env:
          REF: ${{ github.ref_name }}
        run: |
          # A branch ref on workflow_dispatch can contain '/', which is not a
          # valid file name; keep only file-safe characters.
          $ver = ($env:REF -replace '^v','') -replace '[^A-Za-z0-9._-]','-'
          Compress-Archive -Path dist/paniolo -DestinationPath "dist/paniolo-$ver-x86_64-pc-windows-msvc.zip"
          # Write the sidecar with an explicit LF. Out-File ends the line with
          # the platform newline, CRLF here, and `shasum -a 256 -c` on macOS
          # and Linux then reads the file name with a trailing CR and reports
          # it missing (#243).
          $zip = "dist/paniolo-$ver-x86_64-pc-windows-msvc.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText((Join-Path $PWD "$zip.sha256"), "$hash  $(Split-Path $zip -Leaf)`n")

      # Expand the zip that ships and run it, as the Linux job does with its
      # .deb and the macOS job with its tarball. Until 2026-09-10 this job only
      # built and zipped, so the missing skills above went unnoticed for
      # every Windows release.
      - name: Smoke-test the zip
        shell: pwsh
        env:
          REF: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $ver = ($env:REF -replace '^v','') -replace '[^A-Za-z0-9._-]','-'
          $extract = Join-Path $env:RUNNER_TEMP "smoke"
          Expand-Archive "dist/paniolo-$ver-x86_64-pc-windows-msvc.zip" -DestinationPath $extract
          $root = Join-Path $extract "paniolo"
          & "$root/paniolo.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "paniolo.exe --help exited $LASTEXITCODE" }
          # The binary reports the version the build stamped (see "Build every crate").
          $expected = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME -replace "^v", "" } else { "0.0.0-dev." + $env:GITHUB_SHA.Substring(0, 7) }
          $reported = (& "$root/paniolo.exe" --version | Out-String).Trim()
          if ($reported -ne "paniolo $expected") { throw "paniolo.exe --version printed '$reported', expected 'paniolo $expected'" }
          # From outside the checkout, so `skill` resolves the zip's own copy
          # under share/, not the repo's skills/ dir.
          Push-Location $env:RUNNER_TEMP
          $skills = & "$root/paniolo.exe" skill
          Pop-Location
          if ($LASTEXITCODE -ne 0) { throw "paniolo.exe skill exited $LASTEXITCODE" }
          foreach ($name in (Get-ChildItem skills -Directory | Select-Object -ExpandProperty Name)) {
            if (-not ($skills -match "^$name$")) { throw "paniolo skill does not list '$name': $skills" }
          }
          # Run each helper, not just stat it: --help returns 0 only once the
          # binary has loaded.
          foreach ($h in "$env:HELPERS".Split(" ")) {
            & "$root/libexec/$h.exe" --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$h.exe --help exited $LASTEXITCODE" }
          }
          # winocr has no --help; it reads an image and prints the v1 OCR JSON
          # envelope, like visionocr in the macOS job. An 8x8 PNG proves the
          # Windows.Media.Ocr path actually decodes, not just that it starts.
          $tiny = Join-Path $env:RUNNER_TEMP "tiny.png"
          [IO.File]::WriteAllBytes($tiny, [Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAD0lEQVR4nGP4jwMwDC0JALoev0Ewkwr8AAAAAElFTkSuQmCC"))
          $ocr = & "$root/libexec/winocr.exe" --json $tiny | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "winocr.exe exited $LASTEXITCODE" }
          if ($ocr.engine -ne "winocr") { throw "winocr envelope has engine '$($ocr.engine)'" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows-x86_64
          path: dist/*.zip*
          if-no-files-found: error

  package-macos:
    name: package (macos universal)
    runs-on: macos-14
    # The six secrets that gate Developer ID signing + notarization below are
    # read into env here (a step `if:` can't see `secrets` directly — same
    # reason the winget job routes WINGET_TOKEN through env). All six are
    # optional: absent, the job still ships an ad-hoc-signed universal
    # binary, which is what Homebrew needs (see the comment above "Import
    # signing certificate").
    env:
      MACOS_SIGNING_CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
      MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      # The keychain lives under $RUNNER_TEMP; the `runner` context is not
      # available at job level, so the steps derive the path themselves.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-universal
          workspaces: |
            cli
            hdmicap
            serialcap
            netbootd
            cambrionix
            hidrig
            ch9329
            shellyplug
            amt

      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            raw="${GITHUB_REF_NAME#v}"
          else
            raw="0.0.0~dev.$(printf '%.7s' "$GITHUB_SHA")"
          fi
          # Same character filter the Windows zip step applies to its
          # ref-derived version. $raw is already filename-safe here (a tag
          # name has no '/'; a hex commit prefix is only [0-9a-f]) — this
          # just keeps both jobs' sanitization rules identical rather than
          # assuming that stays true. It does turn the dev case's '~' into
          # '-' (unlike the Linux tarball name, which keeps the tilde); that
          # string never reaches dpkg on this path, so it's cosmetic only.
          safe="$(printf '%s' "$raw" | sed -E 's/[^A-Za-z0-9._-]/-/g')"
          echo "version=$safe" >> "$GITHUB_OUTPUT"

      # cli plus every crate in $HELPERS, once per Apple Silicon and Intel
      # target. hdmicap's build.rs compiles src/capture_avf.m with the `cc`
      # crate, which reads the target triple's arch and passes the matching
      # `-arch` to the system clang — verified locally on both targets, no
      # extra Homebrew package needed for either slice (turbojpeg/nasm are a
      # Linux-only dependency, gated to `target_os = "linux"` in
      # hdmicap/Cargo.toml; nothing else in $HELPERS carries a build.rs or a
      # macOS-specific native dependency, including netbootd's pnet_datalink
      # and its /dev/bpf FFI, which is plain libc, no bindgen).
      #
      # netbootd's Cargo.toml declares two [[bin]] targets — netbootd and
      # netbootd-bpf-helper, the setuid-root privilege-separation helper for
      # the macOS raw-frame send path (netbootd/src/bpf.rs, cli/src/setup.rs)
      # — and a bare `cargo build --release` builds both from one
      # manifest-path invocation, so no separate loop entry is needed for it.
      - name: Build release binaries (both targets)
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          PANIOLO_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            for crate in cli $HELPERS; do
              echo "==> cargo build --release --target $target ($crate)"
              cargo build --release --target "$target" --manifest-path "$crate/Cargo.toml"
            done
          done

      # visionocr is not a workspace crate (see ocr/visionocr.swift); built
      # explicitly with swiftc, the same way the Windows job builds winocr
      # explicitly rather than from $HELPERS. macos12.0 is the lowest
      # deployment target tried, per the task; it compiled clean for both
      # slices in local rehearsal with no rejected API, so it was kept
      # rather than raised.
      - name: Build visionocr (both slices)
        run: |
          set -euo pipefail
          mkdir -p dist-stage
          swiftc -O -target arm64-apple-macos12.0 -o dist-stage/visionocr-arm64 ocr/visionocr.swift
          swiftc -O -target x86_64-apple-macos12.0 -o dist-stage/visionocr-x86_64 ocr/visionocr.swift

      # The keg layout `helper_dirs()`/`skills_dirs()` expect from a
      # relocated install (cli/src/daemons.rs, cli/src/skills.rs): the CLI's
      # own resolved path's grandparent is the prefix, so `bin/paniolo` pairs
      # with `libexec/bin/*` and `share/paniolo/skills/*` beside it — NOT the
      # flat layout the Linux tarball uses.
      - name: Stage the keg layout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          root="dist/paniolo-${VERSION}-macos-universal"
          mkdir -p "$root/bin" "$root/libexec/bin" "$root/share/paniolo/skills"

          lipo -create -output "$root/bin/paniolo" \
            "cli/target/aarch64-apple-darwin/release/paniolo" \
            "cli/target/x86_64-apple-darwin/release/paniolo"
          for helper in $HELPERS; do
            lipo -create -output "$root/libexec/bin/$helper" \
              "$helper/target/aarch64-apple-darwin/release/$helper" \
              "$helper/target/x86_64-apple-darwin/release/$helper"
          done
          lipo -create -output "$root/libexec/bin/visionocr" \
            dist-stage/visionocr-arm64 dist-stage/visionocr-x86_64
          # netbootd's second [[bin]] target — see the "Build release
          # binaries" comment above. `paniolo setup`'s run_packaged() looks
          # this up by name via find_binary("netbootd-bpf-helper"), which
          # searches this same libexec/bin dir.
          lipo -create -output "$root/libexec/bin/netbootd-bpf-helper" \
            "netbootd/target/aarch64-apple-darwin/release/netbootd-bpf-helper" \
            "netbootd/target/x86_64-apple-darwin/release/netbootd-bpf-helper"

          for skill in skills/*/SKILL.md; do
            name="$(basename "$(dirname "$skill")")"
            mkdir -p "$root/share/paniolo/skills/$name"
            cp "$skill" "$root/share/paniolo/skills/$name/SKILL.md"
          done
          cp LICENSE README.md "$root/"

      # Ad-hoc signing (a valid signature with no identity behind it) is what
      # Homebrew needs: it never sets a quarantine attribute on files it
      # installs, so there is nothing for Gatekeeper to check and no identity
      # is required — only that every slice carries *a* signature, since an
      # unsigned arm64 Mach-O refuses to launch under AMFI. This step is
      # unconditional, so the smoke test below always runs against a signed
      # tree even when the Developer ID secrets further down are absent.
      # Real Developer ID signing (if present) overwrites these signatures
      # in place, before the tarball is built.
      - name: Ad-hoc sign universal binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          root="dist/paniolo-${VERSION}-macos-universal"
          for f in "$root/bin/paniolo" "$root/libexec/bin/"*; do
            codesign --force -s - "$f"
            codesign --verify --strict "$f"
            lipo -info "$f"
          done

      # ---- Optional Developer ID signing + notarization ----
      # Six secrets, all optional — absent, the two steps below are skipped
      # entirely and the ad-hoc signature from the previous step ships:
      #   MACOS_SIGNING_CERT_P12      base64-encoded Developer ID Application
      #                                .p12 (certificate + private key)
      #   MACOS_SIGNING_CERT_PASSWORD password protecting that .p12
      #   MACOS_SIGNING_IDENTITY      the codesign identity string, e.g.
      #                                "Developer ID Application: NAME (TEAMID)"
      #   MACOS_NOTARY_APPLE_ID       Apple ID used for notarization
      #   MACOS_NOTARY_PASSWORD       an app-specific password for that Apple
      #                                ID — never the account password
      #   MACOS_NOTARY_TEAM_ID        the notarization team ID
      # Gated the same way as package-windows's Azure steps: an `if:` on each
      # step rather than skipping the whole job, so the ad-hoc-signed path
      # above still runs and uploads on every push. This path is untested —
      # there is no signing cert configured on this repo yet, so only the
      # `if: env.MACOS_SIGNING_CERT_P12 != ''` branch staying false has
      # actually executed.
      - name: Import signing certificate
        if: env.MACOS_SIGNING_CERT_P12 != ''
        run: |
          set -euo pipefail
          keychain_password="$(openssl rand -base64 24)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/paniolo-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/paniolo-signing.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/paniolo-signing.keychain-db"
          printf '%s' "$MACOS_SIGNING_CERT_P12" | base64 --decode -o "$RUNNER_TEMP/paniolo-signing.p12"
          security import "$RUNNER_TEMP/paniolo-signing.p12" -P "$MACOS_SIGNING_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$RUNNER_TEMP/paniolo-signing.keychain-db"
          rm -f "$RUNNER_TEMP/paniolo-signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$RUNNER_TEMP/paniolo-signing.keychain-db"
          # Prepend rather than replace, so the runner's default keychains
          # (and whatever else already trusts them) stay on the search list.
          existing="$(security list-keychains -d user | tr -d '"')"
          # Intentionally unquoted: $existing is a list of keychain paths,
          # one per line, that must word-split into separate arguments.
          security list-keychains -d user -s "$RUNNER_TEMP/paniolo-signing.keychain-db" $existing

      - name: Developer ID sign + notarize
        if: env.MACOS_SIGNING_CERT_P12 != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          root="dist/paniolo-${VERSION}-macos-universal"
          for f in "$root/bin/paniolo" "$root/libexec/bin/"*; do
            codesign --force --options runtime --timestamp -s "$MACOS_SIGNING_IDENTITY" "$f"
            codesign --verify --strict "$f"
          done

          # Bare CLI binaries (not an .app/.pkg/.dmg) cannot be stapled —
          # notarytool's ticket only attaches to a bundle — so submit-and-wait
          # for Accepted is the whole check; there is nothing to staple
          # afterward.
          notarize_zip="$RUNNER_TEMP/paniolo-notarize.zip"
          ditto -c -k --keepParent "$root" "$notarize_zip"
          result_json="$RUNNER_TEMP/notarize-result.json"
          xcrun notarytool submit "$notarize_zip" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --wait --output-format json | tee "$result_json"
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$result_json")"
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarization not accepted: $status"
            exit 1
          fi

      - name: Delete signing keychain
        if: always() && env.MACOS_SIGNING_CERT_P12 != ''
        run: security delete-keychain "$RUNNER_TEMP/paniolo-signing.keychain-db" || true

      - name: Notice (no macOS signing secrets)
        if: env.MACOS_SIGNING_CERT_P12 == ''
        run: |
          echo "MACOS_SIGNING_CERT_P12 not set — shipping ad-hoc-signed" \
               "universal binaries. That is what Homebrew needs; it sets no" \
               "quarantine attribute on files it installs, so there is" \
               "nothing for Gatekeeper to check."

      # Built once, after whichever signing path above ran, so there is only
      # ever one tarball and one smoke test — the one that actually ships
      # carries whatever signature is in place at this point (Developer ID,
      # if the secrets above were set; ad-hoc otherwise).
      - name: Build tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          tar -czf "paniolo-${VERSION}-macos-universal.tar.gz" "paniolo-${VERSION}-macos-universal"
          shasum -a 256 "paniolo-${VERSION}-macos-universal.tar.gz" > "paniolo-${VERSION}-macos-universal.tar.gz.sha256"

      - name: Smoke-test the tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          extract="$RUNNER_TEMP/smoke"
          mkdir -p "$extract"
          tar -C "$extract" -xzf "dist/paniolo-${VERSION}-macos-universal.tar.gz"
          root="$extract/paniolo-${VERSION}-macos-universal"

          # Every shipped Mach-O must carry both slices — a build that
          # silently dropped one target should fail here, not on a user's
          # Intel Mac (or an Apple Silicon one running it under Rosetta).
          for f in "$root/bin/paniolo" "$root/libexec/bin/"*; do
            archs="$(lipo -info "$f")"
            echo "$archs"
            case "$archs" in
              *x86_64*arm64*|*arm64*x86_64*) : ;;
              *) echo "::error::$f is not a universal (arm64 + x86_64) binary"; exit 1 ;;
            esac
          done

          "$root/bin/paniolo" --help >/dev/null
          # The binary reports the version the tarball carries.
          test "$("$root/bin/paniolo" --version)" = "paniolo $VERSION"
          # Run outside the checkout so `skill` resolves the packaged copy
          # under the extracted share/ dir, not the repo's own skills/ dir
          # (cli/src/skills.rs skills_dirs() checks a repo checkout first).
          ( cd /tmp && "$root/bin/paniolo" skill )
          for helper in $HELPERS; do
            "$root/libexec/bin/$helper" --help >/dev/null
          done
          # netbootd-bpf-helper takes no --help; called with no arguments it
          # prints a usage line and exits 2 (netbootd/src/bin/netbootd-bpf-helper.rs) —
          # confirms the binary actually runs without needing the root
          # privilege its real invocation requires.
          if "$root/libexec/bin/netbootd-bpf-helper" 2>&1; then
            echo "::error::netbootd-bpf-helper exited 0 with no arguments (expected a usage error)"
            exit 1
          fi

          # visionocr has no --help; it reads an image and prints the v1 OCR
          # JSON envelope (ocr/visionocr.swift). Decode a tiny (8x8, 72-byte)
          # synthetic PNG and confirm the binary actually decodes it through
          # Vision/CoreGraphics/ImageIO and emits that envelope — not just
          # that the process starts.
          tiny_png="$RUNNER_TEMP/tiny.png"
          printf '%s' "iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAD0lEQVR4nGP4jwMwDC0JALoev0Ewkwr8AAAAAElFTkSuQmCC" \
            | base64 --decode -o "$tiny_png"
          "$root/libexec/bin/visionocr" --json "$tiny_png" \
            | python3 -c 'import json, sys; d = json.load(sys.stdin); assert d["engine"] == "visionocr", d'

      # The tarball once more as a Homebrew bottle: the same tree, which is
      # already in keg layout, under paniolo/<version>/ and named the way
      # Homebrew fetches a bottle from a plain https root_url
      # (<name>-<version>.<tag>.bottle.tar.gz). One `all`-tagged bottle
      # serves every macOS version and both arches because the binaries are
      # universal, and Homebrew 7 matches a bottle only by its exact tag or
      # `all`, never an older OS's. Bottles exist because a pour skips
      # Homebrew's build-from-source preflight, which refuses outright on a
      # macOS newer than its Xcode table (#225) even though this formula
      # never compiles anything.
      - name: Build Homebrew bottle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bottle/paniolo/${VERSION}"
          cp -R "dist/paniolo-${VERSION}-macos-universal/." "$RUNNER_TEMP/bottle/paniolo/${VERSION}/"
          tar -C "$RUNNER_TEMP/bottle" -czf "dist/paniolo-${VERSION}.all.bottle.tar.gz" paniolo
          rm -r "$RUNNER_TEMP/bottle"
          cd dist
          shasum -a 256 "paniolo-${VERSION}.all.bottle.tar.gz" > "paniolo-${VERSION}.all.bottle.tar.gz.sha256"

      # Pour it the way a user's `brew install` will: a throwaway formula
      # whose only bottle is this file, whose install block refuses to run.
      # Proves the keg layout and the `all` tag are what Homebrew expects and
      # that a pour needs no toolchain at all; if Homebrew decides to build
      # from the tarball instead, `odie` fails the step. keg_only so nothing
      # links into the runner's prefix.
      - name: Smoke-test the bottle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_AUTOREMOVE: "1"
          HOMEBREW_DEVELOPER: "1"
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/bottle-probe"
          mkdir -p "$probe"
          cp "dist/paniolo-${VERSION}.all.bottle.tar.gz" "$probe/"
          bottle_sha="$(cut -d' ' -f1 "dist/paniolo-${VERSION}.all.bottle.tar.gz.sha256")"
          tarball_sha="$(cut -d' ' -f1 "dist/paniolo-${VERSION}-macos-universal.tar.gz.sha256")"
          cat > "$probe/paniolo.rb" <<EOF
          class Paniolo < Formula
            desc "Bottle pour probe"
            homepage "https://github.com/curtisgalloway/paniolo"
            url "file://$PWD/dist/paniolo-${VERSION}-macos-universal.tar.gz"
            version "${VERSION}"
            sha256 "$tarball_sha"
            license "Apache-2.0"

            bottle do
              root_url "file://$probe"
              sha256 cellar: :any_skip_relocation, all: "$bottle_sha"
            end

            keg_only "bottle pour probe"

            def install
              odie "the probe must pour the bottle, not build from the tarball"
            end
          end
          EOF
          brew install --formula "$probe/paniolo.rb" 2>&1 | tee "$probe/install.log"
          grep -q "Pouring paniolo-${VERSION}.all.bottle.tar.gz" "$probe/install.log"
          keg="$(brew --cellar)/paniolo/${VERSION}"
          test "$("$keg/bin/paniolo" --version)" = "paniolo $VERSION"
          ( cd /tmp && "$keg/bin/paniolo" skill | grep -q '^paniolo' )
          for helper in $HELPERS; do
            "$keg/libexec/bin/$helper" --help >/dev/null
          done
          brew uninstall paniolo

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-macos-universal
          path: dist/*
          if-no-files-found: error

  release:
    name: attach to GitHub Release
    if: github.ref_type == 'tag'
    needs: [package, package-windows, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Verify every sidecar the way a user on macOS or Linux would, before
      # anything is attached. Perl's shasum, not sha256sum: some sha256sum
      # implementations accept a CRLF sidecar that shasum rejects (#243).
      - name: Verify every .sha256 sidecar
        working-directory: dist
        run: shasum -a 256 -c ./*.sha256
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

  winget:
    name: publish to winget
    # Tag-only, and skips prereleases like v0.2.0-rc.1. A no-op until
    # WINGET_TOKEN exists. The FIRST version must be submitted by hand
    # (wingetcreate or komac) to create the package — this action only updates
    # packages that already exist.
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    needs: release
    runs-on: ubuntu-latest
    env:
      # The secrets context is not allowed in a step `if` (it is a parse error
      # that invalidates the whole workflow) — test it through env.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Publish to winget (update PR)
        if: ${{ env.WINGET_TOKEN != '' }}
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: CurtisGalloway.Paniolo
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
      - name: Skipped (no WINGET_TOKEN)
        if: ${{ env.WINGET_TOKEN == '' }}
        run: echo "WINGET_TOKEN not set — skipping winget publish."

  bump-tap:
    name: bump Homebrew tap
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Tell the tap to re-pin its formula. The tap workflow does the actual
      # edit (sha256 of the source tarball, commit) with its OWN GITHUB_TOKEN —
      # all this needs is permission to fire the dispatch, which the default
      # GITHUB_TOKEN can't do cross-repo. HOMEBREW_TAP_DISPATCH_TOKEN is a
      # fine-grained PAT with Contents:write on curtisgalloway/homebrew-tap.
      # Absent (or on a fork), skip rather than fail the release.
      - name: Dispatch formula bump to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_DISPATCH_TOKEN not set — skipping tap bump." \
                 "Add a fine-grained PAT (Contents:write on curtisgalloway/homebrew-tap)."
            exit 0
          fi
          # jq builds the body so the tag is JSON-escaped, not spliced into
          # a string literal.
          body="$(jq -n --arg tag "$TAG" \
            '{event_type: "paniolo-release", client_payload: {tag: $tag}}')"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/curtisgalloway/homebrew-tap/dispatches \
            -d "$body"
          echo "Dispatched paniolo-release (${TAG}) to homebrew-tap."

  refresh-apt-repo:
    name: refresh Pages apt repo
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # The Pages site (docs + /apt/) is assembled by docs.yml, and a Pages
      # deploy replaces the whole site — so after the new .debs are attached
      # to the Release, re-run that workflow to fold them into the apt pool.
      # (A push made with the default GITHUB_TOKEN can't trigger docs.yml on
      # its own; the explicit dispatch is required.)
      - name: Dispatch docs workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
