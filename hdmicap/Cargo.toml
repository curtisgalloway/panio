[package]
name = "hdmicap"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Warm-stream HDMI capture daemon optimized for agent screenshotting + human preview"

[[bin]]
name = "hdmicap"
path = "src/main.rs"

[dependencies]
# --- Async runtime + HTTP ------------------------------------------------
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "net", "process", "io-util"] }
axum = { version = "0.8", features = ["ws"] }

# --- Imaging -------------------------------------------------------------
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Fast pure-Rust JPEG encoder for the preview path (no system deps; the
# image crate's encoder is several times slower at preview resolutions).
jpeg-encoder = "0.7"

# ZRLE (RFB) compression for the noVNC view; already in the build graph
# transitively (image/png), now a direct dependency.
flate2 = "1"

# --- CLI -----------------------------------------------------------------
clap = { version = "4", features = ["derive"] }

# --- Daemon plumbing -----------------------------------------------------

# --- Errors / logging / serde -------------------------------------------
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Client subcommands --------------------------------------------------
ureq = "3"

# --- Preview stream ------------------------------------------------------
async-stream = "0.3"
bytes = "1"

# --- daemon auth: OS entropy for the per-start bearer token (src/auth.rs) ---
getrandom = "0.3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink"] }

# Linux capture: the v4l crate directly, so we can call stream.set_timeout()
# and avoid an indefinite VIDIOC_DQBUF block, plus keep the raw MJPEG tee.
# nokhwa is used for device enumeration only. turbojpeg provides fast MJPEG
# decode (~5ms vs ~50ms pure-Rust) for signal detection.
# macOS capture: our own ObjC AVFoundation layer (src/capture_avf.m,
# compiled by build.rs) — no nokhwa, no vendored bindings fork.
[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10", features = ["input-native"] }
v4l = "0.14"
turbojpeg = { version = "1.4", features = ["image"] }

[build-dependencies]
cc = "1"

# --- process/identity primitives behind src/platform.rs -----------------
# Each platform gets only what it can use: libc on Unix, the Win32 process
# APIs on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
# Media Foundation, for src/capture_mf.rs — the Windows capture backend. This
# is Microsoft's own binding crate, the counterpart of talking to AVFoundation
# directly on macOS and the `v4l` crate on Linux; no third-party camera
# abstraction sits in between.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[dev-dependencies]
# tower::ServiceExt::oneshot drives the auth layer in src/auth.rs's tests.
tower = { version = "0.5", features = ["util"] }
# StreamExt::next(), to pull individual multipart/x-mixed-replace chunks out
# of /preview's response body in server.rs's tests. Not a new dependency in
# practice: axum-core already depends on futures-util directly, with this
# same feature set (it's what implements Body/BodyDataStream's Stream impl),
# so this only exposes the crate already in the build graph under our own
# name for test code to use, without pulling in anything axum-core doesn't
# already request.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
lto = "thin"
