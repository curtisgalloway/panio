# Keep systemd-tmpfiles out of panio's runtime directory.
#
# Panio's daemons publish their discovery file, advisory lock, binary
# identity and stderr log under /tmp/panio-<uid>/, and nothing rewrites those
# files after the daemon starts. Debian ships `q /tmp 1777 root root 10d`, so
# systemd-tmpfiles-clean deletes every one of them once a daemon has been
# running for ten days. The daemon does not notice: it keeps running and keeps
# its capture device, while panio -- whose only handle on it was the deleted
# file -- reports the channel stopped and cannot stop or restart it. The next
# `watch` then dies on the advisory lock the orphan still holds. Measured on a
# Pi 5 control host: three hdmicap daemons, 13 days old, ~95 CPU-hours,
# invisible to every panio command (GitHub issue #187).
#
# `x` means "ignore this path and everything below it when cleaning". It
# creates nothing, and does not affect clearing /tmp at boot, which is exactly
# what should happen -- a discovery file means nothing across a reboot.
#
# `panio daemons` can now see and reap such an orphan whatever the policy on
# the host; this drop-in is what stops one from being created in the first
# place on a packaged install.
x /tmp/panio-*
