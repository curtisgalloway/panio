[targets.pico]

[targets.pico.netboot]
interface = "en7"
tftp_root = "~/tftp/pico"

[[targets.pico.serial]]
name = "console"
device = "/dev/cu.usbserial-AAA"
baud = 115200

[targets.pico.power]
cycle_cmd = "shellyplug -d 192.0.2.41 cycle"

[targets.tablet]

[targets.tablet.adb]
serial = "ABC123"
# panio lab — managed by the `panio` CLI; hand-edits are preserved

