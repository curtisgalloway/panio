[targets.pico]

[targets.pico.netboot]
interface = "en7"
tftp_root = "~/tftp/pico"

[[targets.pico.serial]]
name = "console"
device = "/dev/cu.usbserial-AA"
baud = 115200

[targets.pico.video]
device = "HDMI"

[targets.pico.power]
cycle_cmd = "shellyplug -d 192.0.2.41 cycle"
state_cmd = "shellyplug -d 192.0.2.41 state"

[targets.pico.hid]
cmd = "hidrig -d /dev/cu.usbmodem1234"

[targets.board]

[targets.board.video]
device = "HDMI2"

[targets.board.hid]
cmd = "hidrig -d /dev/cu.usbmodem9999"
# panio lab — managed by the `panio` CLI; hand-edits are preserved

