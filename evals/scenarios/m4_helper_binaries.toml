id = "m4"
title = "Discover and run a bundled helper binary"
tier = "t0"
core = false
conditions = ["cold", "warm", "preloaded"]
capabilities = ["helper"]
goal = """
What helper programs does panio bundle, and how would I run one of them
directly — say, to query a smart plug's state? List the exact command(s).
"""
traps = [
  "bare `panio helper` LISTS the bundled helpers; `panio helper <name> [args]` runs one",
  "helpers are NOT top-level panio subcommands — there is no `panio shellyplug` / `panio hidrig` / `panio zigplug`",
]
reference = [
  'panio helper',
  'panio helper shellyplug -d 192.0.2.41 state',
]
seed = ""

[grader]
type = "judge"
