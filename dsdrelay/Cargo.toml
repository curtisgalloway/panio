[package]
name = "dsdrelay"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CLI for DSD TECH SH-UR01A and SH-UR04A USB serial AT relay boards (power control, NC wiring)"

[[bin]]
name = "dsdrelay"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serialport = "4"

[profile.release]
opt-level = 3
lto = "thin"
