[package]
name = "ch9329"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CLI for the WCH CH9329 USB-HID bridge (Openterface Mini-KVM): keyboard/mouse injection over a control UART, speaking panio's HID serial protocol"

[[bin]]
name = "ch9329"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serialport = "4"

# --- serve (daemon) mode: async runtime + HTTP/WebSocket --------------------
# The CH9329 UART is driven by the blocking `serialport` path on a dedicated
# thread (see uart.rs) — tokio-serial's async reads are unreliable on a macOS
# tty — bridged to the async server via tokio channels.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "net", "io-util"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"

# --- daemon plumbing + client ----------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

# --- daemon auth: OS entropy for the per-start bearer token (src/auth.rs) ---
getrandom = "0.2"

# --- process/identity primitives behind src/platform.rs -----------------
# Each platform gets only what it can use: libc on Unix, the Win32 process
# APIs on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
# tower::ServiceExt::oneshot drives the auth layer in src/auth.rs's tests.
tower = { version = "0.5", features = ["util"] }
# A paused clock lets a test cross the daemon's 30 s wait without waiting.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
